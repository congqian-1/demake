openapi: 3.0.3
info:
  title: Batch & Packaging Hierarchy Query API
  version: 1.0.0
servers:
  - url: http://localhost:8080
paths:
  /api/v1/production/batches/{batchNum}/hierarchy:
    get:
      summary: Get full batch hierarchy
      parameters:
        - name: batchNum
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Batch hierarchy result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultBatchHierarchy'
        '404':
          description: Batch not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/production/prepackage-orders/{orderNum}/hierarchy:
    get:
      summary: Get full prepackage hierarchy
      parameters:
        - name: orderNum
          in: path
          required: true
          schema:
            type: string
        - name: workId
          in: query
          required: false
          schema:
            type: string
          description: Optional work order ID for lookup when orderNum is not available
      responses:
        '200':
          description: Prepackage hierarchy result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultPrepackageHierarchy'
        '404':
          description: Prepackage order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ResultBatchHierarchy:
      type: object
      properties:
        code:
          type: string
          example: "0"
        message:
          type: string
          example: OK
        data:
          $ref: '#/components/schemas/BatchHierarchy'
      required: [code, message, data]
    ResultPrepackageHierarchy:
      type: object
      properties:
        code:
          type: string
          example: "0"
        message:
          type: string
          example: OK
        data:
          $ref: '#/components/schemas/PrepackageHierarchy'
      required: [code, message, data]
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: "404"
        message:
          type: string
          example: Batch not found
        data:
          nullable: true
      required: [code, message]
    BatchHierarchy:
      type: object
      properties:
        batch:
          $ref: '#/components/schemas/Batch'
        optimizingFiles:
          type: array
          items:
            $ref: '#/components/schemas/OptimizingFile'
      required: [batch, optimizingFiles]
    PrepackageHierarchy:
      type: object
      properties:
        prepackageOrder:
          $ref: '#/components/schemas/PrepackageOrder'
      required: [prepackageOrder]
    Batch:
      type: object
      properties:
        id: { type: integer, format: int64 }
        batchNum: { type: string }
        batchType: { type: integer, format: int32 }
        productTime: { type: string, format: date }
        nestingTime: { type: string, format: date-time }
        simpleBatchNum: { type: string }
        ymba014: { type: string }
        ymba016: { type: string }
        isDeleted: { type: integer, format: int32 }
        createdBy: { type: string }
        createdTime: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedTime: { type: string, format: date-time }
      required: [id, batchNum]
    OptimizingFile:
      type: object
      properties:
        id: { type: integer, format: int64 }
        batchId: { type: integer, format: int64 }
        batchNum: { type: string }
        optimizingFileName: { type: string }
        stationCode: { type: string }
        urgency: { type: integer, format: int32 }
        isDeleted: { type: integer, format: int32 }
        createdBy: { type: string }
        createdTime: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedTime: { type: string, format: date-time }
        workOrders:
          type: array
          items:
            $ref: '#/components/schemas/WorkOrder'
      required: [id, batchId, workOrders]
    WorkOrder:
      type: object
      properties:
        id: { type: integer, format: int64 }
        batchId: { type: integer, format: int64 }
        optimizingFileId: { type: integer, format: int64, nullable: true }
        batchNum: { type: string }
        workId: { type: string }
        route: { type: string }
        routeId: { type: string }
        orderType: { type: string }
        deliveryTime: { type: string, format: date-time }
        nestingTime: { type: string, format: date-time }
        ymba014: { type: string }
        ymba015: { type: string }
        ymba016: { type: string }
        part0: { type: string }
        condition0: { type: string }
        partTime0: { type: string, format: date-time }
        zuz: { type: integer, format: int32 }
        prepackageStatus: { type: string }
        retryCount: { type: integer, format: int32 }
        lastPullTime: { type: string, format: date-time }
        errorMessage: { type: string }
        isDeleted: { type: integer, format: int32 }
        createdBy: { type: string }
        createdTime: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedTime: { type: string, format: date-time }
        prepackageOrder:
          $ref: '#/components/schemas/PrepackageOrder'
      required: [id, batchId, workId]
    PrepackageOrder:
      type: object
      properties:
        id: { type: integer, format: int64 }
        workOrderId: { type: integer, format: int64 }
        batchId: { type: integer, format: int64 }
        batchNum: { type: string }
        workId: { type: string }
        orderNum: { type: string }
        consignor: { type: string }
        contractNo: { type: string }
        workNum: { type: string }
        receiver: { type: string }
        phone: { type: string }
        shipBatch: { type: string }
        installAddress: { type: string }
        customer: { type: string }
        receiveRegion: { type: string }
        space: { type: string }
        packType: { type: string }
        productType: { type: string }
        prepackageInfoSize: { type: integer, format: int32 }
        totalSet: { type: integer, format: int32 }
        maxPackageNo: { type: integer, format: int32 }
        productionNum: { type: string }
        isDeleted: { type: integer, format: int32 }
        createdBy: { type: string }
        createdTime: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedTime: { type: string, format: date-time }
        boxes:
          type: array
          items:
            $ref: '#/components/schemas/Box'
      required: [id, workOrderId, orderNum, boxes]
    Box:
      type: object
      properties:
        id: { type: integer, format: int64 }
        prepackageOrderId: { type: integer, format: int64 }
        batchNum: { type: string }
        workId: { type: string }
        boxCode: { type: string }
        building: { type: string }
        house: { type: string }
        room: { type: string }
        setno: { type: integer, format: int32 }
        color: { type: string }
        isDeleted: { type: integer, format: int32 }
        createdBy: { type: string }
        createdTime: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedTime: { type: string, format: date-time }
        packages:
          type: array
          items:
            $ref: '#/components/schemas/Package'
      required: [id, prepackageOrderId, boxCode, packages]
    Package:
      type: object
      properties:
        id: { type: integer, format: int64 }
        boxId: { type: integer, format: int64 }
        batchNum: { type: string }
        workId: { type: string }
        boxCode: { type: string }
        packageNo: { type: integer, format: int32 }
        length: { type: number, format: double }
        width: { type: number, format: double }
        depth: { type: number, format: double }
        weight: { type: number, format: double }
        partCount: { type: integer, format: int32 }
        boxType: { type: string }
        isDeleted: { type: integer, format: int32 }
        createdBy: { type: string }
        createdTime: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedTime: { type: string, format: date-time }
        parts:
          type: array
          items:
            $ref: '#/components/schemas/Part'
      required: [id, boxId, packageNo, parts]
    Part:
      type: object
      properties:
        id: { type: integer, format: int64 }
        packageId: { type: integer, format: int64 }
        boxId: { type: integer, format: int64 }
        batchNum: { type: string }
        workId: { type: string }
        partCode: { type: string }
        layer: { type: integer, format: int32 }
        piece: { type: integer, format: int32 }
        itemCode: { type: string }
        itemName: { type: string }
        matName: { type: string }
        itemLength: { type: number, format: double }
        itemWidth: { type: number, format: double }
        itemDepth: { type: number, format: double }
        xAxis: { type: number, format: double }
        yAxis: { type: number, format: double }
        zAxis: { type: number, format: double }
        sortOrder: { type: integer, format: int32 }
        standardList: { type: string }
        realPackageNo: { type: string }
        isDeleted: { type: integer, format: int32 }
        createdBy: { type: string }
        createdTime: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedTime: { type: string, format: date-time }
        workReports:
          type: array
          items:
            $ref: '#/components/schemas/WorkReport'
      required: [id, packageId, partCode, workReports]
    WorkReport:
      type: object
      properties:
        id: { type: integer, format: int64 }
        workId: { type: string }
        partCode: { type: string }
        partStatus: { type: string }
        stationCode: { type: string }
        stationName: { type: string }
        reportTime: { type: string, format: date-time }
        isDeleted: { type: integer, format: int32 }
        createdBy: { type: string }
        createdTime: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedTime: { type: string, format: date-time }
      required: [id, partCode]
