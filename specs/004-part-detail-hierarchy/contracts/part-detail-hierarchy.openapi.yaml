openapi: 3.0.3
info:
  title: Part Detail Hierarchy API
  version: 1.0.0
paths:
  /api/v1/production/part/{partCode}/detail:
    get:
      summary: 查询板件详细信息并返回上层层级实体
      parameters:
        - name: partCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartDetailResponse'
        '404':
          description: Not found
        '500':
          description: Server error
components:
  schemas:
    PartDetailResponse:
      type: object
      properties:
        id: { type: integer, format: int64 }
        partCode: { type: string }
        batchNum: { type: string }
        workId: { type: string }
        boxId: { type: integer, format: int64 }
        packageId: { type: integer, format: int64 }
        layer: { type: integer }
        piece: { type: integer }
        itemCode: { type: string }
        itemName: { type: string }
        matName: { type: string }
        itemLength: { type: number }
        itemWidth: { type: number }
        itemDepth: { type: number }
        xAxis: { type: number }
        yAxis: { type: number }
        zAxis: { type: number }
        sortOrder: { type: integer }
        standardList: { type: array, items: { type: object } }
        standardListRaw: { type: string }
        realPackageNo: { type: string }
        latestPartStatus: { type: string }
        package:
          $ref: '#/components/schemas/Package'
        box:
          $ref: '#/components/schemas/Box'
        prepackageOrder:
          $ref: '#/components/schemas/PrepackageOrder'
        workOrder:
          $ref: '#/components/schemas/WorkOrder'
        optimizingFile:
          $ref: '#/components/schemas/OptimizingFile'
        batch:
          $ref: '#/components/schemas/Batch'
        isDeleted: { type: integer }
        createdTime: { type: string, format: date-time }
        updatedTime: { type: string, format: date-time }
        description: { type: string }
        color: { type: string }
    Package:
      type: object
      nullable: true
      properties:
        id: { type: integer, format: int64 }
        boxId: { type: integer, format: int64 }
        batchNum: { type: string }
        workId: { type: string }
        boxCode: { type: string }
        packageNo: { type: integer }
        length: { type: number }
        width: { type: number }
        depth: { type: number }
        weight: { type: number }
        partCount: { type: integer }
        boxType: { type: string }
        isDeleted: { type: integer }
        createdBy: { type: string }
        createdTime: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedTime: { type: string, format: date-time }
    Box:
      type: object
      nullable: true
      properties:
        id: { type: integer, format: int64 }
        prepackageOrderId: { type: integer, format: int64 }
        batchNum: { type: string }
        workId: { type: string }
        boxCode: { type: string }
        building: { type: string }
        house: { type: string }
        room: { type: string }
        setno: { type: integer }
        color: { type: string }
        isDeleted: { type: integer }
        createdBy: { type: string }
        createdTime: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedTime: { type: string, format: date-time }
    PrepackageOrder:
      type: object
      nullable: true
      properties:
        id: { type: integer, format: int64 }
        workOrderId: { type: integer, format: int64 }
        batchId: { type: integer, format: int64 }
        batchNum: { type: string }
        workId: { type: string }
        orderNum: { type: string }
        consignor: { type: string }
        contractNo: { type: string }
        workNum: { type: string }
        receiver: { type: string }
        phone: { type: string }
        shipBatch: { type: string }
        installAddress: { type: string }
        customer: { type: string }
        receiveRegion: { type: string }
        space: { type: string }
        packType: { type: string }
        productType: { type: string }
        prepackageInfoSize: { type: integer }
        totalSet: { type: integer }
        maxPackageNo: { type: integer }
        productionNum: { type: string }
        isDeleted: { type: integer }
        createdBy: { type: string }
        createdTime: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedTime: { type: string, format: date-time }
    WorkOrder:
      type: object
      nullable: true
      properties:
        id: { type: integer, format: int64 }
        batchId: { type: integer, format: int64 }
        optimizingFileId: { type: integer, format: int64 }
        batchNum: { type: string }
        workId: { type: string }
        route: { type: string }
        routeId: { type: string }
        orderType: { type: string }
        deliveryTime: { type: string, format: date-time }
        nestingTime: { type: string, format: date-time }
        ymba014: { type: string }
        ymba015: { type: string }
        ymba016: { type: string }
        part0: { type: string }
        condition0: { type: string }
        partTime0: { type: string, format: date-time }
        zuz: { type: integer }
        prepackageStatus: { type: string }
        retryCount: { type: integer }
        lastPullTime: { type: string, format: date-time }
        errorMessage: { type: string }
        isDeleted: { type: integer }
        createdBy: { type: string }
        createdTime: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedTime: { type: string, format: date-time }
    OptimizingFile:
      type: object
      nullable: true
      properties:
        id: { type: integer, format: int64 }
        batchId: { type: integer, format: int64 }
        batchNum: { type: string }
        optimizingFileName: { type: string }
        stationCode: { type: string }
        urgency: { type: integer }
        isDeleted: { type: integer }
        createdBy: { type: string }
        createdTime: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedTime: { type: string, format: date-time }
    Batch:
      type: object
      nullable: true
      properties:
        id: { type: integer, format: int64 }
        batchNum: { type: string }
        batchType: { type: integer }
        productTime: { type: string, format: date-time }
        nestingTime: { type: string, format: date-time }
        simpleBatchNum: { type: string }
        ymba014: { type: string }
        ymba016: { type: string }
        isDeleted: { type: integer }
        createdBy: { type: string }
        createdTime: { type: string, format: date-time }
        updatedBy: { type: string }
        updatedTime: { type: string, format: date-time }
